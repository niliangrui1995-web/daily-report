[project]
name = "vcp-hunter-daily-report"
version = "0.1.0"
description = "VCP Hunter North America AI supply-chain daily report pipeline"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=0.120.0,<1",
    "bleach>=6.4.0,<7",
    "certifi>=2026.7.22",
    "chinesecalendar>=1.11.0,<2",
    "cryptography>=49.0.0,<50",
    "curl-cffi>=0.15.0,<1",
    "feedparser>=6.0.12,<7",
    "google-genai>=2.14.0,<3",
    "markdown>=3.10.2,<4",
    "openai>=2.48.0,<3",
    "pandas>=3.0.5,<4",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    "ratelimit>=2.2.1,<3",
    "requests>=2.34.2,<3",
    "scrapling>=0.4.11,<1",
    "setuptools>=83.0.0,<84",
    "yfinance>=1.5.2,<2",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0,<2",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.16.0,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["每日战报/tests"]
pythonpath = ["每日战报"]

[tool.ruff]
target-version = "py314"
exclude = ["每日热点输出"]

[tool.ruff.lint]
select = ["E9", "F", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 35

[tool.coverage.run]
branch = true
source = ["每日战报"]
omit = ["每日战报/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
precision = 2
