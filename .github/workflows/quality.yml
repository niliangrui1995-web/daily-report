name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_DOTENV_DISABLED: "1"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv lock --check
          uv sync --locked --group dev

      - name: Lint critical errors
        run: uv run ruff check 每日战报

      - name: Compile source
        run: uv run python -m compileall -q 每日战报

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=65 -q

      - name: Audit locked runtime dependencies
        if: runner.os == 'Linux'
        run: |
          uv export --locked --no-dev --output-file .audit-requirements.txt
          uv run pip-audit --requirement .audit-requirements.txt --disable-pip

      - name: Reject new secrets
        if: runner.os == 'Linux'
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
